<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tray</title>
<style>
  /* Same paper as the portfolio, so the frame does not read as a card. */
  html, body {
    margin: 0;
    height: 100%;
    background: #f3f3f1;
    display: flex;
    flex-direction: column;
  }
  body { position: relative; }
  #stage {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    aspect-ratio: auto;
    --hairline-plate: #f3f3f1;
    --hairline-hi: #121211;
    --hairline-edge: #8d8d86;
    --hairline-mid: #b9b9b2;
    --hairline-lo: #d8d8d2;
  }
  /* The name sits above the mark, outside the drawing. It only shows while the pointer is on that tile. */
  #caption {
    position: absolute;
    z-index: 2;
    margin: 0;
    padding: 0.1rem 0.5rem 0.14rem;
    border: 1px solid rgba(18, 18, 17, 0.14);
    border-radius: 999px;
    background: #fbfbfa;
    color: #5c5c57;
    font: 400 0.75rem/1.3 ui-sans-serif, system-ui, sans-serif;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, calc(-100% - 6px));
    transition: opacity 160ms cubic-bezier(0.2, 0, 0, 1);
  }
  #caption.on { opacity: 1; }
  /* Sits under the drawing's bottom-right corner. */
  #note {
    position: relative;
    z-index: 1;
    flex: 0 0 auto;
    height: 1.15rem;
    margin: 0;
    padding-top: 2px;
    color: #8a8a84;
    font: 400 0.68rem/1.15rem ui-sans-serif, system-ui, sans-serif;
    text-align: right;
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage"></div>
<p id="caption" aria-hidden="true">Figma</p>
<p id="note">Toolkit til Oct 2026; Expanding Ongoing</p>
<script src="/hairline/kernel.js"></script>
<script>
  /* The figure calls hairline() as soon as it loads. This is the page it lands on. */
  window.hairline = (figure) => {
    const stage = document.getElementById("stage");
    HL.inject(document);
    stage.setAttribute("data-hairline", figure.name);
    stage.setAttribute("role", "img");
    stage.setAttribute("aria-label", figure.means);
    /* Cropped to the tray, with room above for a lifted tile. The drawing scale is unchanged. */
    const svg = HL.mk("svg", { viewBox: "35 65.3 330.1 219.3", preserveAspectRatio: "xMidYMid meet", "aria-hidden": "true" }, stage);
    const label = document.getElementById("caption");
    let caption = "";
    let tracking = 0;
    /* Follow the active mark while its name is showing, so the label stays above it as the tile lifts. */
    function placeLabel() {
      const mark = caption
        ? stage.querySelector(`svg svg[data-mark="${CSS.escape(caption)}"]`)
        : null;
      if (!mark) return;
      const stageBox = stage.getBoundingClientRect();
      const box = mark.getBoundingClientRect();
      label.style.left = (box.left - stageBox.left + box.width / 2) + "px";
      label.style.top = (box.top - stageBox.top) + "px";
      label.textContent = caption;
    }
    function track() {
      placeLabel();
      tracking = requestAnimationFrame(track);
    }
    const read = {
      get textContent() { return caption; },
      set textContent(value) {
        caption = value == null ? "" : String(value);
        /* Tool names from TILE_MARKS; "rest" / "slot N" stay quiet. */
        const showing = !!caption && caption !== "rest" && !caption.startsWith("slot ");
        label.classList.toggle("on", showing);
        label.setAttribute("aria-hidden", showing ? "false" : "true");
        if (showing && !tracking) tracking = requestAnimationFrame(track);
        if (!showing && tracking) { cancelAnimationFrame(tracking); tracking = 0; }
      },
    };
    figure.mount({ stage, svg, read }, figure.range[1]);
    const note = document.getElementById("note");
    const drawn = svg.getBBox();
    /* The line's right edge meets the drawing's right edge, just under it. */
    function placeNote() {
      const vb = svg.viewBox.baseVal;
      const stageBox = stage.getBoundingClientRect();
      const right = (drawn.x + drawn.width - vb.x) / vb.width * stageBox.width;
      note.style.width = right + "px";
    }
    placeNote();
    addEventListener("resize", placeNote);
    if (figure.tour) HL.tour(stage, figure.tour);
  };
</script>
<script src="/hairline/tray.js"></script>
</body>
</html>
