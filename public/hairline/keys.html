<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keys</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #f3f3f1;
  }
  #stage {
    width: 100%;
    height: 100%;
    aspect-ratio: auto;
    --hairline-plate: #f3f3f1;
    --hairline-hi: #121211;
    --hairline-edge: #8d8d86;
    --hairline-mid: #b9b9b2;
    --hairline-lo: #a3a39c;
  }
</style>
</head>
<body>
<div id="stage"></div>
<script src="/hairline/kernel.js"></script>
<script>
  window.hairline = (figure) => {
    const stage = document.getElementById("stage");
    HL.inject(document);
    stage.setAttribute("data-hairline", figure.name);
    stage.setAttribute("role", "img");
    stage.setAttribute("aria-label", figure.means);
    const svg = HL.mk("svg", {
      viewBox: "138 146 124 36",
      preserveAspectRatio: "xMidYMid meet",
      "aria-hidden": "true",
    }, stage);
    figure.mount({ stage, svg }, figure.range[1]);
  };
</script>
<script src="/hairline/keys.js?v=8"></script>
</body>
</html>
