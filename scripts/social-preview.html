<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  @font-face { font-family: Geist; src: url('__SANS__'); }
  @font-face { font-family: GeistSerif; src: url('__SERIF__'); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f8f6ef; color: #171717; font-family: Geist, sans-serif; }
  .wash { position: absolute; inset: -15%; filter: blur(48px); background:
    radial-gradient(ellipse 100% 105% at 0% 0%, #add8d3 0%, transparent 70%),
    radial-gradient(ellipse 85% 100% at 100% 20%, #ead494 0%, transparent 70%),
    radial-gradient(ellipse 110% 100% at 70% 110%, #d6cbc0 0%, transparent 70%); opacity: .5; }
  .light { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, #ffffff99, transparent 75%); }
  .grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .015; }
  main { position: relative; height: 100%; padding: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .name { margin: 0; font: 400 36px/44px GeistSerif, serif; letter-spacing: 2px; }
  .caption { margin: 12px 0 0; color: #737373; font-size: 20px; line-height: 30px; letter-spacing: -.2px; }
</style>
<div class="wash"></div><div class="light"></div>
<svg class="grain" xmlns="http://www.w3.org/2000/svg"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#grain)"/></svg>
<main>
  <h1 class="name">Felix Teng</h1>
  <p class="caption">Product designer through an engineering lens.</p>
</main>
</html>
